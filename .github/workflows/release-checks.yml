---
name: Release checks

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    name: Release tests and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out code for unprivileged tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install PowerShell test tools
        run: |
          Install-PSResource -Name Pester -Version '[6.1.0,7.0.0)' -TrustRepository -Quiet
          Install-PSResource -Name PSScriptAnalyzer -Version '[1.25.0,2.0.0)' -TrustRepository -Quiet
      - name: Install workflow validators
        run: python -m pip install --disable-pip-version-check -r .github/requirements-release-tests.txt
      - name: Test and lint without publishing
        run: ./.github/scripts/Test-Release.ps1
